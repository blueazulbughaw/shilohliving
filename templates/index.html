<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Shiloh Living</title>
<link rel="apple-touch-icon" href="/static/icons/icon-192.png"/>
<link rel="stylesheet" href="/static/css/app.css"/>
  <link rel="manifest" href="/static/manifest.json"/>
  <meta name="theme-color" content="#2D6A4F"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Shiloh Living"/>
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png"/>
</head>
<body>

<!-- Cloudinary upload widget -->
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
<!-- QR Code library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- ═══════════════════════════════════════════
     AUTH SCREEN
═══════════════════════════════════════════ -->
<div id="auth-screen" style="display:none">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>🏠 Shiloh Living</h1>
      <p>Rental Management Platform</p>
    </div>

    <div class="auth-tabs">
      <button class="active" onclick="showTab('login')">Sign In</button>
      <button onclick="showTab('register')">Register</button>
    </div>

    <!-- LOGIN TAB -->
    <div id="tab-login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••"/>
      </div>
      <button class="btn-primary" onclick="doLogin()">Sign In</button>
      <p style="text-align:center;margin-top:10px;font-size:13px">
        <a href="#" onclick="showForgotPassword()" style="color:var(--brand)">Forgot your password?</a>
      </p>
      <p class="err-msg" id="login-err"></p>
    </div>

    <!-- REGISTER TAB -->
    <div id="tab-register" style="display:none">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Min 8 chars, uppercase, number, symbol"/>
        <small style="color:var(--muted);font-size:12px;margin-top:4px;display:block">
          Must contain uppercase, lowercase, a number, and a special character.
        </small>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="reg-confirm-password" placeholder="Re-enter your password"/>
      </div>
      <div class="form-group">
        <label>Phone (optional)</label>
        <input type="text" id="reg-phone"/>
      </div>
      <div class="form-group">
        <label>I am a…</label>
        <select id="reg-role" onchange="onRoleChange()">
          <option value="landlord">Landlord</option>
          <option value="tenant">Tenant</option>
        </select>
      </div>
      <div id="register-extra" style="display:none">
        <div id="landlord-fields" style="display:none">
          <div class="form-group">
            <label>Business Name (optional)</label>
            <input type="text" id="reg-biz"/>
          </div>
        </div>
        <div id="tenant-fields" style="display:none">
          <div class="form-group">
            <label>Landlord Code <span style="color:var(--muted);font-weight:400">(optional)</span></label>
            <input type="text" id="reg-code" placeholder="e.g. LXXXXXXX" style="text-transform:uppercase"/>
            <small style="color:var(--muted);font-size:12px;margin-top:4px;display:block">
              Ask your landlord for their code, or skip and join later from your dashboard.
            </small>
          </div>
        </div>
      </div>
      <button class="btn-primary" onclick="doRegister()">Create Account</button>
      <p class="err-msg" id="reg-err"></p>
    </div>

  </div>
</div>

<!-- ═══════════════════════════════════════════
     APP SCREEN
═══════════════════════════════════════════ -->
<div id="app-screen" style="display:none">

  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <h2>🏠 Shiloh Living</h2>
      <p id="sidebar-role-label">Platform</p>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div class="sidebar-footer">
      <div class="user-badge">
        <div class="avatar" id="sidebar-avatar">U</div>
        <div class="user-info">
          <div class="name" id="sidebar-name">User</div>
          <div class="role" id="sidebar-role">—</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h2 id="topbar-title">Dashboard</h2>
      </div>
      <div class="topbar-right">
        <button class="notif-btn" onclick="toggleNotifDropdown()" id="notif-btn">
          🔔<span class="notif-badge" id="notif-badge">0</span>
        </button>
      </div>
    </div>

    <!-- Notifications dropdown -->
    <div class="notif-dropdown" id="notif-dropdown">
      <div class="notif-header">
        <h4>Notifications</h4>
        <button class="btn btn-sm btn-outline" onclick="markAllNotifsRead()">Mark all read</button>
      </div>
      <div id="notif-list">
        <div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">No notifications</div>
      </div>
    </div>

    <!-- LANDLORD PAGES -->
    <div id="page-dashboard"       class="page"></div>
    <div id="page-properties"      class="page"></div>
    <div id="page-units"           class="page"></div>
    <div id="page-tenants"         class="page"></div>
    <div id="page-contracts"       class="page"></div>
    <div id="page-bills"           class="page"></div>
    <div id="page-water"           class="page"></div>
    <div id="page-payments"        class="page"></div>
    <div id="page-announcements"   class="page"></div>
    <div id="page-messages"        class="page"></div>
    <div id="page-reminders"       class="page"></div>
    <div id="page-support"         class="page"></div>
    <div id="page-l-settings"      class="page"></div>

    <!-- TENANT PAGES -->
    <div id="page-t-dashboard"     class="page"></div>
    <div id="page-t-contract"      class="page"></div>
    <div id="page-t-bills"         class="page"></div>
    <div id="page-t-announcements" class="page"></div>
    <div id="page-t-messages"      class="page"></div>
    <div id="page-t-settings"      class="page"></div>
    <div id="page-t-support"       class="page"></div>

    <!-- ADMIN PAGES -->
    <div id="page-admin-stats"     class="page"></div>
    <div id="page-admin-landlords" class="page"></div>
    <div id="page-admin-tenants"   class="page"></div>
    <div id="page-admin-tickets"   class="page"></div>
    <div id="page-admin-chat"      class="page"></div>
    <div id="page-admin-audit"     class="page"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- App JS — loaded last so all DOM elements exist when the script runs -->
<script src="/static/js/app.js">
    
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js', { scope: '/' })
        .then(r => console.log('[SW] Registered:', r.scope))
        .catch(e => console.warn('[SW] Failed:', e));
    });
  }
</script>

</body>
</html>
