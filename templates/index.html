<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Shiloh Living</title>
<meta name="description" content="Rent, bills, payments and messages for landlords and tenants."/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#f7f7f2"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Shiloh Living"/>
<link rel="icon" type="image/png" href="/static/icons/icon-192.png"/>
<link rel="apple-touch-icon" href="/static/icons/icon-192.png"/>
<link rel="stylesheet" href="/static/css/app.css"/>
</head>
<body>

<!-- "Install the app" prompt (static/js/app.js installPrompt) -->
<div id="install-banner" class="install-banner" hidden>
  <img src="/static/icons/icon-192.png" alt="" width="36" height="36"/>
  <span id="install-text"></span>
  <button id="install-btn" class="btn btn-brand btn-sm" hidden>Install</button>
  <button id="install-dismiss" class="install-close" aria-label="Dismiss">✕</button>
</div>

<!-- AUTH SCREEN — filled by app.js (sign in, tenant join code, landlord registration) -->
<div id="auth-screen" style="display:none">
  <div class="auth-card" id="auth-card"></div>
</div>

<!-- APP SCREEN -->
<div id="app-screen" style="display:none">

  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <h2 class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M4 15.2 16 5l12 10.2v12.3H4V15.2Z" fill="currentColor"/><path d="M12.3 27.5v-8.3h7.4v8.3" stroke="#244F3D" stroke-width="2"/><path d="M8.7 15.7h4.2" stroke="#244F3D" stroke-width="1.7" stroke-linecap="round"/></svg></span><span>shiloh<span class="brand-light">living</span></span></h2>
      <p id="sidebar-role-label">Rental Management</p>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div class="sidebar-footer">
      <div class="user-badge">
        <div class="avatar" id="sidebar-avatar">U</div>
        <div class="user-info">
          <div class="name" id="sidebar-name">User</div>
          <div class="role" id="sidebar-role">—</div>
        </div>
      </div>
      <button class="btn-logout" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <div class="main-content">
    <div class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
        <button class="back-btn" id="back-btn" onclick="goBack()" aria-label="Back" hidden>‹ Back</button>
        <h2 id="topbar-title">Dashboard</h2>
      </div>
      <div class="topbar-right">
        <button class="notif-btn" onclick="toggleNotifDropdown()" id="notif-btn" aria-label="Notifications">
          🔔<span class="notif-badge" id="notif-badge">0</span>
        </button>
      </div>
    </div>

    <div class="notif-dropdown" id="notif-dropdown">
      <div class="notif-header">
        <h4>Notifications</h4>
        <button class="btn btn-sm btn-outline" onclick="markAllNotifsRead()">Mark all read</button>
      </div>
      <div id="notif-list"><div class="notif-empty">No notifications</div></div>
    </div>

    <div id="plan-banner" hidden></div>

    <!-- LANDLORD PAGES -->
    <div id="page-dashboard"       class="page"></div>
    <div id="page-properties"      class="page"></div>
    <div id="page-gen-rent"        class="page"></div>
    <div id="page-tenants"         class="page"></div>
    <div id="page-contracts"       class="page"></div>
    <div id="page-bills"           class="page"></div>
    <div id="page-water"           class="page"></div>
    <div id="page-payments"        class="page"></div>
    <div id="page-announcements"   class="page"></div>
    <div id="page-messages"        class="page"></div>
    <div id="page-reminders"       class="page"></div>
    <div id="page-support"         class="page"></div>
    <div id="page-l-settings"      class="page"></div>
    <div id="page-billing"         class="page"></div>
    <div id="page-account"         class="page"></div>

    <!-- TENANT PAGES -->
    <div id="page-t-dashboard"     class="page"></div>
    <div id="page-t-checklist"     class="page"></div>
    <div id="page-t-contract"      class="page"></div>
    <div id="page-t-bills"         class="page"></div>
    <div id="page-t-announcements" class="page"></div>
    <div id="page-t-messages"      class="page"></div>
    <div id="page-t-settings"      class="page"></div>
    <div id="page-t-support"       class="page"></div>

    <!-- ADMIN PAGES -->
    <div id="page-admin-stats"     class="page"></div>
    <div id="page-admin-landlords" class="page"></div>
    <div id="page-admin-tenants"   class="page"></div>
    <div id="page-admin-invites"   class="page"></div>
    <div id="page-admin-tickets"   class="page"></div>
    <div id="page-admin-chat"      class="page"></div>
    <div id="page-admin-audit"     class="page"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h3 id="modal-title"></h3>
      <button class="modal-close" onclick="closeModalDirect()" aria-label="Close">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
